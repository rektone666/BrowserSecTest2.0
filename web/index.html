<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>BrowserSec Framework</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand">BrowserSec Framework</div>
      <h1>Checking this browser</h1>
    </header>

    <section class="card" aria-live="polite">
      <div class="progress-head">
        <strong id="phase">Preparing checks…</strong>
        <span id="counter">0 / 0</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Scan progress">
        <div id="progress" class="progress-bar"></div>
      </div>
      <p id="current" class="current">Starting the local test engine.</p>
    </section>

    <section class="card">
      <h2>Live results</h2>
      <div id="results" class="results"></div>
    </section>

    <section id="complete" class="card complete" hidden>
      <h2>Scan complete</h2>
      <p id="complete-message">The report is being generated by the local application.</p>
      <p class="muted">This page can be closed after the report opens.</p>
    </section>

    <footer>
      <span>Local-only automatic scan</span>
      <span>BrowserSec v0.1.0</span>
    </footer>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
